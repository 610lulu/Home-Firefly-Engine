<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Firefly Engine Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1c2028;
      --panel-2: #252b35;
      --text: #eef3fb;
      --muted: #aab4c3;
      --line: #343c49;
      --accent: #63d2ff;
      --warm: #ffb04f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 62px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .metric strong {
      font-size: 18px;
      font-weight: 650;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label,
    .label {
      color: var(--muted);
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    button,
    .file-button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 8px;
      min-height: 38px;
      padding: 8px 10px;
      font: inherit;
      cursor: pointer;
      text-align: center;
    }

    button:hover,
    .file-button:hover {
      border-color: var(--accent);
    }

    button.active {
      border-color: var(--accent);
      background: #173243;
      color: #dff6ff;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-size: 14px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    input[type="file"] {
      display: none;
    }

    .stage {
      position: relative;
      min-width: 0;
      padding: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 38px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        #151922;
      background-size: 40px 40px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <h1>Home Firefly Engine</h1>

      <section class="status" aria-label="Preview status">
        <div class="metric">
          <span>State</span>
          <strong id="stateValue">waiting</strong>
        </div>
        <div class="metric">
          <span>Brightness</span>
          <strong id="brightnessValue">0.00</strong>
        </div>
        <div class="metric">
          <span>People</span>
          <strong id="peopleValue">0</strong>
        </div>
        <div class="metric">
          <span>Heart</span>
          <strong id="heartValue">0</strong>
        </div>
      </section>

      <section class="controls" aria-label="Preview controls">
        <div class="field">
          <div class="label">State</div>
          <div class="segmented">
            <button data-state="waiting" class="active">Waiting</button>
            <button data-state="pulse">Pulse</button>
            <button data-state="homecoming">Home</button>
          </div>
        </div>

        <label class="field">
          People <span id="peopleLabel">12</span>
          <input id="peopleRange" type="range" min="0" max="30" value="12">
        </label>

        <label class="field">
          Heart rate <span id="heartLabel">78</span>
          <input id="heartRange" type="range" min="45" max="150" value="78">
        </label>

        <div class="row">
          <label class="switch">
            <input id="demoToggle" type="checkbox" checked>
            Demo motion
          </label>
          <label class="switch">
            <input id="labelsToggle" type="checkbox" checked>
            Labels
          </label>
        </div>

        <label class="file-button">
          Load layout JSON
          <input id="layoutInput" type="file" accept=".json,application/json">
        </label>

        <label class="file-button">
          Load drawing image
          <input id="backgroundInput" type="file" accept="image/png,image/gif,image/jpeg,image/webp">
        </label>
      </section>
    </aside>

    <section class="stage">
      <div class="toolbar">
        <div class="hint" id="layoutInfo">Example layout loaded: 24 lights</div>
        <div class="hint">Tower marker is cyan</div>
      </div>
      <div class="canvas-wrap">
        <canvas id="previewCanvas"></canvas>
      </div>
    </section>
  </main>

  <script>
    const TAU = Math.PI * 2;
    const canvas = document.getElementById("previewCanvas");
    const ctx = canvas.getContext("2d");
    const controls = {
      people: document.getElementById("peopleRange"),
      heart: document.getElementById("heartRange"),
      demo: document.getElementById("demoToggle"),
      labels: document.getElementById("labelsToggle"),
      layoutInput: document.getElementById("layoutInput"),
      backgroundInput: document.getElementById("backgroundInput"),
    };

    const text = {
      state: document.getElementById("stateValue"),
      brightness: document.getElementById("brightnessValue"),
      people: document.getElementById("peopleValue"),
      heart: document.getElementById("heartValue"),
      peopleLabel: document.getElementById("peopleLabel"),
      heartLabel: document.getElementById("heartLabel"),
      layoutInfo: document.getElementById("layoutInfo"),
    };

    let currentState = "waiting";
    let homecomingStartedAt = 0;
    let backgroundImage = null;

    let layout = {
      name: "Example layout",
      lights: [
        {id: 0, name: "A01", x: 0.10, y: 0.78},
        {id: 1, name: "A02", x: 0.18, y: 0.72},
        {id: 2, name: "A03", x: 0.26, y: 0.68},
        {id: 3, name: "A04", x: 0.34, y: 0.64},
        {id: 4, name: "A05", x: 0.42, y: 0.60},
        {id: 5, name: "A06", x: 0.50, y: 0.56},
        {id: 6, name: "A07", x: 0.58, y: 0.52},
        {id: 7, name: "A08", x: 0.66, y: 0.48},
        {id: 8, name: "A09", x: 0.74, y: 0.44},
        {id: 9, name: "A10", x: 0.82, y: 0.38},
        {id: 10, name: "B01", x: 0.14, y: 0.40},
        {id: 11, name: "B02", x: 0.22, y: 0.36},
        {id: 12, name: "B03", x: 0.30, y: 0.33},
        {id: 13, name: "B04", x: 0.38, y: 0.30},
        {id: 14, name: "B05", x: 0.46, y: 0.27},
        {id: 15, name: "B06", x: 0.54, y: 0.25},
        {id: 16, name: "B07", x: 0.62, y: 0.23},
        {id: 17, name: "B08", x: 0.70, y: 0.21},
        {id: 18, name: "C01", x: 0.30, y: 0.84},
        {id: 19, name: "C02", x: 0.40, y: 0.80},
        {id: 20, name: "C03", x: 0.50, y: 0.76},
        {id: 21, name: "C04", x: 0.60, y: 0.72},
        {id: 22, name: "C05", x: 0.70, y: 0.68},
        {id: 23, name: "TOWER", x: 0.50, y: 0.08}
      ]
    };

    const config = {
      tower: {x: 0.5, y: 0.08},
      pulse: {x: 0.38, y: 0.62, radius: 0.32},
      presenceRadius: 0.22,
      idleBrightness: 0.012,
      maxPresencePoints: 6,
      minBrightness: 0.08,
      maxBrightness: 1.0,
      peopleMax: 20,
      homecomingDuration: 30,
    };

    function clamp(value, min = 0, max = 1) {
      return Math.max(min, Math.min(max, value));
    }

    function mix(a, b, amount) {
      return a + (b - a) * amount;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function setState(nextState) {
      currentState = nextState;
      if (nextState === "homecoming") {
        homecomingStartedAt = performance.now() / 1000;
      }
      document.querySelectorAll("[data-state]").forEach((button) => {
        button.classList.toggle("active", button.dataset.state === nextState);
      });
    }

    document.querySelectorAll("[data-state]").forEach((button) => {
      button.addEventListener("click", () => {
        controls.demo.checked = false;
        setState(button.dataset.state);
      });
    });

    controls.people.addEventListener("input", () => {
      controls.demo.checked = false;
      updateLabels();
    });
    controls.heart.addEventListener("input", () => {
      controls.demo.checked = false;
      updateLabels();
    });

    controls.layoutInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const parsed = JSON.parse(await file.text());
      if (!Array.isArray(parsed.lights)) {
        alert("Layout JSON needs a lights array.");
        return;
      }
      layout = parsed;
      text.layoutInfo.textContent = `${parsed.name || file.name}: ${parsed.lights.length} lights`;
    });

    controls.backgroundInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        backgroundImage = image;
        URL.revokeObjectURL(url);
      };
      image.src = url;
    });

    function updateLabels() {
      text.peopleLabel.textContent = controls.people.value;
      text.heartLabel.textContent = controls.heart.value;
    }

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(320, Math.floor(rect.width * ratio));
      canvas.height = Math.max(320, Math.floor(rect.height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function canvasPoint(position) {
      const rect = canvas.getBoundingClientRect();
      const margin = 34;
      return {
        x: margin + position.x * (rect.width - margin * 2),
        y: margin + position.y * (rect.height - margin * 2),
      };
    }

    function demoInputs(seconds) {
      const people = Math.round(14 + 11 * (0.5 + 0.5 * Math.sin(seconds * 0.32)));
      const heart = Math.round(74 + 22 * (0.5 + 0.5 * Math.sin(seconds * 1.18)));
      controls.people.value = people;
      controls.heart.value = heart;

      if (people > 20 && currentState !== "homecoming") {
        setState("homecoming");
      }
      if (currentState === "homecoming") {
        const elapsed = seconds - homecomingStartedAt;
        if (elapsed > config.homecomingDuration) {
          setState("pulse");
        }
      } else if (heart > 0) {
        setState("pulse");
      }
    }

    function peoplePositions(seconds, people) {
      if (people <= 0) {
        return [];
      }

      const pointCount = Math.min(config.maxPresencePoints, Math.max(1, Math.ceil(people / 5)));
      const positions = [];
      for (let index = 0; index < pointCount; index++) {
        const speed = controls.demo.checked ? 0.18 + index * 0.035 : 0;
        const phase = seconds * speed + index * 1.73;
        positions.push({
          x: clamp(0.5 + Math.sin(phase) * (0.24 + index * 0.025)),
          y: clamp(0.56 + Math.cos(phase * 0.83) * (0.22 - index * 0.015)),
          weight: Math.max(1, Math.floor(people / pointCount)),
        });
      }
      return positions;
    }

    function presenceInfluence(light, frame) {
      if (!frame.peoplePositions.length) {
        return 0;
      }

      let strongest = 0;
      for (const person of frame.peoplePositions) {
        const influence = clamp(1 - distance(light, person) / config.presenceRadius);
        strongest = Math.max(strongest, influence * influence);
      }
      return strongest;
    }

    function brightnessFromPeople(people) {
      const level = clamp(people / config.peopleMax);
      return mix(config.minBrightness, config.maxBrightness, level);
    }

    function renderLight(light, index, frame, maxTowerDistance) {
      const seconds = frame.seconds;
      const base = frame.brightness;
      const presence = presenceInfluence(light, frame);
      let red = 255;
      let green = 176;
      let blue = 72;
      let effectBrightness = base;

      if (frame.state === "homecoming") {
        const d = distance(light, config.tower);
        const normalized = d / maxTowerDistance;
        const flowPhase = (normalized * 3.5 + seconds * 0.72) % 1;
        const wave = Math.pow(Math.max(0, 1 - Math.min(flowPhase, 1 - flowPhase) * 2), 2.7);
        const towerGlow = Math.pow(1 - normalized, 1.7);
        effectBrightness = clamp(base * 0.48 + wave * 0.78 + towerGlow * 0.35);
        const flowMix = clamp(wave + towerGlow * 0.55);
        red = mix(255, 118, flowMix);
        green = mix(176, 224, flowMix);
        blue = mix(72, 255, flowMix);
      } else if (frame.state === "pulse") {
        const heart = clamp(frame.heart, 40, 180);
        const beat = heart / 60;
        let breath = 0.5 - 0.5 * Math.cos(seconds * beat * TAU);
        breath *= breath;
        const influence = clamp(1 - distance(light, config.pulse) / config.pulse.radius);
        const localPulse = breath * influence;
        const flicker = 0.9 + 0.1 * Math.sin(seconds * 1.3 + index * 0.47);
        effectBrightness = clamp(base * flicker + localPulse * 0.55);
        green = mix(176, 66, localPulse);
        blue = mix(72, 122, localPulse);
      } else {
        const flicker = 0.92 + 0.08 * Math.sin(seconds * 1.7 + index * 0.61);
        effectBrightness = clamp(base * flicker);
      }

      const brightness = clamp(config.idleBrightness + presence * effectBrightness);
      return {red, green, blue, brightness};
    }

    function color({red, green, blue, brightness}) {
      const level = clamp(brightness);
      return `rgb(${Math.round(red * level)}, ${Math.round(green * level)}, ${Math.round(blue * level)})`;
    }

    function render() {
      const seconds = performance.now() / 1000;
      if (controls.demo.checked) {
        demoInputs(seconds);
      }
      updateLabels();

      const people = Number(controls.people.value);
      const heart = Number(controls.heart.value);
      const brightness = brightnessFromPeople(people);
      const frame = {
        seconds,
        state: currentState,
        people,
        heart,
        brightness,
        peoplePositions: peoplePositions(seconds, people)
      };
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);

      if (backgroundImage) {
        const margin = 34;
        ctx.globalAlpha = 0.78;
        ctx.drawImage(backgroundImage, margin, margin, rect.width - margin * 2, rect.height - margin * 2);
        ctx.globalAlpha = 1;
      }

      const lights = [...layout.lights].sort((a, b) => a.id - b.id);
      const maxTowerDistance = Math.max(0.001, ...lights.map((light) => distance(light, config.tower)));

      for (const [index, light] of lights.entries()) {
        const point = canvasPoint(light);
        const rendered = renderLight(light, index, frame, maxTowerDistance);
        const radius = 4 + rendered.brightness * 11;

        ctx.beginPath();
        ctx.fillStyle = color(rendered);
        ctx.shadowColor = color(rendered);
        ctx.shadowBlur = 12 + rendered.brightness * 18;
        ctx.arc(point.x, point.y, radius, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (controls.labels.checked) {
          ctx.fillStyle = "#f4f7fb";
          ctx.font = "11px Segoe UI, Arial";
          ctx.textAlign = "center";
          ctx.fillText(light.name || light.id, point.x, point.y - radius - 8);
        }
      }

      for (const person of frame.peoplePositions) {
        const point = canvasPoint(person);
        const radius = 15;
        ctx.strokeStyle = "rgba(255,255,255,0.92)";
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius, 0, TAU);
        ctx.fill();
        ctx.stroke();

        const influencePoint = canvasPoint({
          x: person.x + config.presenceRadius,
          y: person.y
        });
        const influenceRadius = Math.abs(influencePoint.x - point.x);
        ctx.strokeStyle = "rgba(99,210,255,0.18)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(point.x, point.y, influenceRadius, 0, TAU);
        ctx.stroke();
      }

      const tower = canvasPoint(config.tower);
      ctx.strokeStyle = "#a8f0ff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(tower.x, tower.y, 9, 0, TAU);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(tower.x - 13, tower.y);
      ctx.lineTo(tower.x + 13, tower.y);
      ctx.moveTo(tower.x, tower.y - 13);
      ctx.lineTo(tower.x, tower.y + 13);
      ctx.stroke();

      text.state.textContent = frame.state;
      text.brightness.textContent = frame.brightness.toFixed(2);
      text.people.textContent = frame.people;
      text.heart.textContent = `${frame.heart} / ${frame.peoplePositions.length} zones`;

      requestAnimationFrame(render);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    updateLabels();
    render();
  </script>
</body>
</html>
